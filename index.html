<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="MultiBooker makes it easy for a group to find a time that actually works.">
  <title>MultiBooker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brandButton" type="button" aria-label="MultiBooker home">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span>MultiBooker</span>
    </button>
    <button class="icon-button hidden" id="refreshButton" type="button" aria-label="Refresh group" title="Refresh">↻</button>
  </header>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div id="modalContent"></div></dialog>
  <script src="app.js" defer></script>
</body>
</html>
