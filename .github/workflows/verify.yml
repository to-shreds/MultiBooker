name: Verify MultiBooker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Install Worker dependencies
        working-directory: worker
        run: npm install

      - name: Run Worker checks
        working-directory: worker
        run: npm run check

      - name: Prepare temporary Worker fallback assets
        run: |
          mkdir -p worker/public
          cp index.html styles.css app.js manifest.webmanifest worker/public/

      - name: Validate Worker bundle
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
