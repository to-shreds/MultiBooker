name: Complete MultiBooker bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Restore exact source files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/app.js.gz.b64.* | base64 --decode | gzip --decompress > app.js
          base64 --decode .bootstrap/styles.css.gz.b64 | gzip --decompress > styles.css
          mkdir -p worker/src .github/workflows
          base64 --decode .bootstrap/worker-core.js.gz.b64 | gzip --decompress > worker/src/core.js
          base64 --decode .bootstrap/worker-index.js.gz.b64 | gzip --decompress > worker/src/index.js
          cp .bootstrap/workflows/*.yml .github/workflows/

      - name: Verify restored source
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check worker/src/core.js
          node --check worker/src/index.js
          cd worker
          npm test

      - name: Commit completed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap .github/workflows/bootstrap.yml
          git add app.js styles.css worker/src/core.js worker/src/index.js .github/workflows
          git commit -m "Complete initial MultiBooker build"
          git push

