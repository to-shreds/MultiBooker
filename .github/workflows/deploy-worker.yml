name: Deploy MultiBooker Worker

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multibooker-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare Worker static assets
        run: |
          mkdir -p worker/public
          cp index.html styles.css app.js manifest.webmanifest worker/public/

      - name: Install and test Worker
        working-directory: worker
        run: npm install && npm run check

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Verify deployed Worker
        run: |
          curl --fail --silent --show-error https://multibooker-api.jonathanjablon.workers.dev/health
          curl --fail --silent --show-error https://multibooker-api.jonathanjablon.workers.dev/ | grep -q "MultiBooker"
